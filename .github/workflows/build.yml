name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Build Flutter App Release
        run: |
          # 1. Create a fresh Flutter template in a separate folder
          flutter create --project-name smart_hisab --org com.hisabkhata.app app_workspace
          
          # 2. Copy your custom code and dependencies into the workspace
          cp pubspec.yaml app_workspace/pubspec.yaml
          cp lib/main.dart app_workspace/lib/main.dart
          
          # 3. Navigate and build the APK
          cd app_workspace
          flutter pub get
          flutter build apk --release
          
          # 4. Move output apk to root for upload
          mkdir -p ../output_apk
          cp build/app/outputs/flutter-apk/app-release.apk ../output_apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output_apk/app-release.apk
