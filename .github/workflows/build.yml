name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Setup Android Project Files Safely
        run: |
          mkdir -p /tmp/my_backup
          cp -r lib /tmp/my_backup/
          cp pubspec.yaml /tmp/my_backup/
          flutter create . --platforms=android --project-name smart_hisab --org com.hisabkhata.app --overwrite
          cp -r /tmp/my_backup/lib/* lib/
          cp /tmp/my_backup/pubspec.yaml pubspec.yaml

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
