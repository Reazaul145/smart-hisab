name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Create Clean Workspace and Inject Code
        run: |
          # 1. Create a fresh standard Android Flutter project
          flutter create --project-name smart_hisab --org com.hisabkhata.app project_root
          
          # 2. Replace with our actual app code and config
          cp pubspec.yaml project_root/pubspec.yaml
          cp lib/main.dart project_root/lib/main.dart
          
          # 3. Enter project and fetch dependencies
          cd project_root
          flutter pub get
          
          # 4. Build Release APK
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Business-Tracker-Pro-APK
          path: project_root/build/app/outputs/flutter-apk/app-release.apk
